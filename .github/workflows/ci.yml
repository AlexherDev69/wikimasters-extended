name: CI

# Feature branches are covered by pull_request, push is limited to main to avoid duplicate runs
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository. The repository default is already
# read-only, but a workflow of a public repository states its own scope so a
# fork, and any later change of that default, cannot widen it.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit SHA rather than a tag: a tag can be
      # moved to other code by whoever owns the action. Dependabot raises these
      # pins, and the comment says which release each SHA is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version is read from the packageManager field of package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check for dead code
        run: pnpm knip
