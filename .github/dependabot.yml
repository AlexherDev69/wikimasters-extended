# Security updates are opened by GitHub itself; these two entries keep the
# dependencies and the pinned action SHAs moving in between advisories.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The workflow pins every action to a commit SHA, so this is what raises
  # those pins when the action publishes a new release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
